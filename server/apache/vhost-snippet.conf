# Apache vhost snippet for Lichternacht
#
# Requires:
#   a2enmod proxy proxy_http
#
# Proxies API calls to the local python service (server.py).

ProxyPass        "/api/"  "http://127.0.0.1:8000/api/"
ProxyPassReverse "/api/"  "http://127.0.0.1:8000/api/"

# Optional (if you use /upload in production):
# ProxyPass        "/upload"  "http://127.0.0.1:8000/upload"
# ProxyPassReverse "/upload"  "http://127.0.0.1:8000/upload"

